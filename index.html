<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="逆水寒猜技能">
<title>逆水寒・猜技能</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0B0D11; --ink-2:#12161C; --ink-3:#1A1F27;
  --paper:#EFE9D9; --paper-2:#DED6C2;
  --gold:#C9A227; --gold-lt:#E8C867;
  --red:#B8342A; --red-lt:#D9564A;
  --jade:#3E7C7B; --jade-lt:#6FB3AE;
  --line:rgba(239,233,217,.13);
  --mx:rgba(239,233,217,.42);
  --r:13px;
}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
    radial-gradient(120% 70% at 50% -8%, #1C232C 0%, var(--ink-2) 38%, var(--ink) 100%);
  color:var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(239,233,217,.05) .7px,transparent .7px);
  background-size:3px 3px;opacity:.5;
}
.screen{position:relative;z-index:1;max-width:440px;margin:0 auto;display:none}
.screen.on{display:block}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.hide{display:none!important}

/* ===== 頂部 ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;min-height:34px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{
  font-family:"Songti TC","Noto Serif TC","Times New Roman",serif;
  font-size:19px;font-weight:700;letter-spacing:.12em;color:var(--paper);
}
.brand span{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--gold);opacity:.8}
.pill{
  flex:none;font-size:11.5px;font-weight:800;letter-spacing:.04em;
  border:1px solid var(--line);background:rgba(255,255,255,.04);
  padding:5px 10px;border-radius:999px;color:var(--paper-2);
}
.pill b{color:var(--gold-lt);font-size:13px}

/* ===== 劍痕進度 ===== */
.trail{display:flex;gap:3px;margin:0 0 14px;height:4px}
.trail i{flex:1;border-radius:2px;background:rgba(239,233,217,.1)}
.trail i.ok{background:var(--gold)}
.trail i.ng{background:var(--red)}
.trail i.cur{background:var(--paper);box-shadow:0 0 8px rgba(239,233,217,.6)}

/* ===== 開始 ===== */
.hero{padding-top:4vh}
.hero .seal{
  display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;
  border:1px solid rgba(201,162,39,.4);background:rgba(201,162,39,.08);
  border-radius:6px;padding:6px 11px;font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--gold-lt);
}
.hero h1{
  font-family:"Songti TC","Noto Serif TC",serif;
  font-size:40px;line-height:1.12;font-weight:700;letter-spacing:.04em;margin:0 0 14px;
}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{font-size:13.5px;line-height:1.8;color:var(--mx);margin:0}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:22px 0 0}
.spec{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.spec span{display:block;font-size:9.5px;font-weight:800;letter-spacing:.16em;color:var(--mx);margin-bottom:3px}
.spec b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.spec b small{font-size:11px;font-weight:700;color:var(--mx);margin-left:5px}
.btn-start{
  width:100%;height:56px;margin-top:16px;border:0;border-radius:var(--r);
  background:linear-gradient(180deg,#D9564A,#A62C22);color:#fff;
  font-size:16px;font-weight:800;letter-spacing:.1em;
  box-shadow:0 12px 26px -14px rgba(184,52,42,.95), inset 0 1px 0 rgba(255,255,255,.22);
}
.btn-start:active{transform:translateY(1px)}
.note{font-size:11.5px;line-height:1.7;color:rgba(239,233,217,.38);margin:14px 2px 0}
.note b{color:rgba(239,233,217,.68);font-weight:700}
.demoflag{
  margin-top:14px;padding:10px 13px;border-radius:10px;
  border:1px dashed rgba(201,162,39,.45);background:rgba(201,162,39,.07);
  font-size:11.5px;line-height:1.65;color:rgba(232,200,103,.9);
}

/* ===== 題目 ===== */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.qtags{display:flex;gap:6px;min-width:0}
.ctag{
  font-size:10px;font-weight:800;letter-spacing:.12em;padding:4px 9px;border-radius:5px;
  border:1px solid;white-space:nowrap;
}
.ctag[data-c="職業"]{color:var(--red-lt);border-color:rgba(217,86,74,.45);background:rgba(184,52,42,.12)}
.ctag[data-c="江湖"]{color:var(--jade-lt);border-color:rgba(111,179,174,.4);background:rgba(62,124,123,.14)}
.ctag[data-c="群俠"]{color:var(--gold-lt);border-color:rgba(201,162,39,.42);background:rgba(201,162,39,.1)}
.ctag[data-c="絕技"]{color:#C8A2E8;border-color:rgba(200,162,232,.4);background:rgba(140,90,190,.14)}
.qidx{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--mx);flex:none}
.qidx b{color:var(--paper);font-size:14px}

.stage{
  position:relative;border-radius:18px;padding:22px 16px 18px;text-align:center;
  background:
    radial-gradient(80% 60% at 50% 0%, rgba(201,162,39,.1), transparent 70%),
    linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
  border:1px solid var(--line);
  box-shadow:0 22px 44px -30px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.07);
}
.iconwrap{
  width:132px;height:132px;margin:0 auto 14px;position:relative;
  border-radius:16px;padding:3px;
  background:linear-gradient(160deg, rgba(201,162,39,.85), rgba(201,162,39,.18) 45%, rgba(239,233,217,.12));
  box-shadow:0 14px 30px -18px rgba(0,0,0,.9);
}
.iconwrap img{width:100%;height:100%;display:block;border-radius:13px;object-fit:cover;background:#0E1218}
.iconwrap::after{
  content:'';position:absolute;inset:-9px;border-radius:22px;pointer-events:none;
  border:1px solid rgba(201,162,39,.16);
}
.ask{font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--mx)}

.opts{display:grid;gap:9px;margin-top:15px}
.opt{
  position:relative;width:100%;min-height:56px;padding:12px 46px 12px 16px;text-align:left;
  border-radius:12px;border:1.5px solid var(--line);
  background:rgba(255,255,255,.045);color:var(--paper);
  font-size:16.5px;font-weight:700;letter-spacing:.02em;line-height:1.35;
  transition:border-color .16s, background .16s, transform .1s;
  display:flex;align-items:center;
}
.opt:active{transform:scale(.992)}
.opt .mark{
  position:absolute;right:13px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border-radius:50%;display:none;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;
}
.opt.locked{cursor:default}
.opt.ok{border-color:var(--gold);background:rgba(201,162,39,.16);color:#fff}
.opt.ok .mark{display:flex;background:var(--gold);color:#2A1D00}
.opt.ng{border-color:rgba(184,52,42,.85);background:rgba(184,52,42,.16);color:#FFD9D4}
.opt.ng .mark{display:flex;background:var(--red);color:#fff}
.opt.dim{opacity:.42}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.opt.ok,.opt.ng{animation:pop .26s ease}

.verdict{
  margin-top:13px;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:11px;
  border:1px solid;animation:slide .24s ease;
}
@keyframes slide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.verdict.good{background:rgba(201,162,39,.11);border-color:rgba(201,162,39,.4)}
.verdict.bad{background:rgba(184,52,42,.12);border-color:rgba(184,52,42,.42)}
.verdict .stamp{
  flex:none;width:42px;height:42px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:21px;font-weight:900;font-family:"Songti TC",serif;
  transform:rotate(-6deg);
}
.verdict.good .stamp{background:var(--gold);color:#2A1D00}
.verdict.bad .stamp{background:var(--red);color:#fff}
.verdict .txt{min-width:0;flex:1}
.verdict .k{font-size:10px;font-weight:800;letter-spacing:.16em;opacity:.6;display:block;margin-bottom:1px}
.verdict .v{font-size:16px;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verdict .cat{font-size:11px;font-weight:700;opacity:.55}

.btn-next{
  width:100%;height:52px;margin-top:12px;border:0;border-radius:var(--r);
  background:var(--paper);color:#131720;font-size:15px;font-weight:800;letter-spacing:.08em;
}
.btn-next:active{transform:translateY(1px)}
.btn-next small{font-size:10.5px;font-weight:700;opacity:.5;margin-left:5px}

/* ===== 成績 ===== */
.res-hero{text-align:center;padding:14px 0 6px}
.res-hero .rank{
  display:inline-block;font-family:"Songti TC",serif;font-size:15px;font-weight:700;letter-spacing:.24em;
  color:var(--gold-lt);border:1px solid rgba(201,162,39,.42);border-radius:5px;padding:5px 13px;margin-bottom:16px;
}
.res-score{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;color:#fff}
.res-score small{font-size:20px;font-weight:700;color:var(--mx);letter-spacing:0;margin-left:4px}
.res-sub{font-size:13px;color:var(--mx);margin-top:8px}
.res-sub b{color:var(--gold-lt)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}
.bar{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.bar span{display:block;font-size:9.5px;font-weight:800;letter-spacing:.16em;color:var(--mx);margin-bottom:3px}
.bar b{font-size:19px;font-weight:800}
.bar b.g{color:var(--gold-lt)} .bar b.r{color:var(--red-lt)}

.review{margin-top:20px}
.review h2{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--mx);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.review h2:after{content:'';flex:1;height:1px;background:var(--line)}
.rv{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid rgba(239,233,217,.07)}
.rv:last-child{border-bottom:0}
.rv img{width:38px;height:38px;border-radius:8px;flex:none;background:#0E1218;border:1px solid var(--line)}
.rv .t{min-width:0;flex:1}
.rv .n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv .y{font-size:11px;color:var(--red-lt);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv .x{font-size:15px;flex:none;color:var(--red-lt);font-weight:900}
.acts2{display:flex;gap:9px;margin-top:18px}
.btn-2{
  flex:1;height:50px;border-radius:var(--r);border:1.5px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--paper);font-size:14px;font-weight:800;letter-spacing:.05em;
}
.btn-2.primary{background:linear-gradient(180deg,#D9564A,#A62C22);border-color:transparent;color:#fff}
.btn-2:active{transform:translateY(1px)}

.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:rgba(20,24,30,.97);border:1px solid var(--line);color:#fff;
  font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:10px;z-index:70;
  opacity:0;pointer-events:none;transition:.2s;max-width:86vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.verchip{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(2px + env(safe-area-inset-bottom));
  background:none;border:0;color:rgba(239,233,217,.2);font-size:9.5px;font-weight:700;letter-spacing:.12em;
  padding:6px;z-index:5;
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
@media (max-height:720px){
  .hero{padding-top:1vh}
  .hero h1{font-size:33px}
  .iconwrap{width:112px;height:112px}
  .stage{padding:16px 14px 14px}
  .opt{min-height:50px;font-size:15.5px}
}
</style>
</head>
<body>

<!-- ===== 開始 ===== -->
<section class="screen on" id="scStart">
  <div class="hero">
    <span class="seal">NSH SKILL QUIZ</span>
    <h1>逆水寒<br><em>猜技能</em></h1>
    <p>看圖示，選出正確的技能名稱。<br>全職業、江湖、群俠、絕技混合出題。</p>

    <div class="specs">
      <div class="spec"><span>題數</span><b id="spTotal">30<small>題</small></b></div>
      <div class="spec"><span>選項</span><b>4<small>選 1</small></b></div>
    </div>

    <button class="btn-start" id="btnStart">開始挑戰</button>
    <p class="note">每個人拿到的<b>題目順序與選項排列都不同</b>。答完一題會顯示正確答案，不論對錯都會進下一題。</p>
    <div class="demoflag hide" id="demoFlag"></div>
  </div>
</section>

<!-- ===== 題目 ===== -->
<section class="screen" id="scQuiz">
  <div class="top">
    <div class="brand"><b>逆水寒</b><span>猜技能</span></div>
    <span class="pill"><b id="scNow">0</b> / <span id="scAll">0</span></span>
  </div>
  <div class="trail" id="trail"></div>

  <div class="qhead">
    <div class="qtags" id="qTags"></div>
    <div class="qidx num">第 <b id="qNo">1</b> 題</div>
  </div>

  <div class="stage">
    <div class="iconwrap"><img id="qIcon" alt="技能圖示"></div>
    <div class="ask">這是哪個技能？</div>
  </div>

  <div class="opts" id="opts"></div>
  <div id="verdictSlot"></div>
</section>

<!-- ===== 成績 ===== -->
<section class="screen" id="scResult">
  <div class="top">
    <div class="brand"><b>逆水寒</b><span>成績</span></div>
  </div>
  <div class="res-hero">
    <div class="rank" id="rankLabel">—</div>
    <div class="res-score num"><span id="resRight">0</span><small>/ <span id="resTotal">0</span></small></div>
    <div class="res-sub">正確率 <b id="resPct">0%</b></div>
  </div>
  <div class="bars">
    <div class="bar"><span>答對</span><b class="g num" id="resOk">0</b></div>
    <div class="bar"><span>答錯</span><b class="r num" id="resNg">0</b></div>
  </div>
  <div class="review hide" id="reviewWrap">
    <h2>答錯的題目</h2>
    <div id="reviewList"></div>
  </div>
  <div class="acts2">
    <button class="btn-2" id="btnHome">回到首頁</button>
    <button class="btn-2 primary" id="btnAgain">再玩一次</button>
  </div>
</section>

<div class="toast" id="toast"></div>
<button class="verchip" id="verChip">v1.3.0</button>

<script src="skills.js"></script>
<script>
window.APP_VERSION = '1.3.0';

const KEY = 'nshQuiz.v1';
const QUIZ_LEN = 30;
const OPTIONS = 4;

const $ = (s, r = document) => r.querySelector(s);
let S = null;          // 本次測驗狀態
let locked = false;    // 本題是否已作答

/* ---------- 亂數（可重現，同一人同一次測驗順序固定） ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- 出題 ---------- */
function buildQuiz(skills, len, seed) {
  const pool = skills.filter(s => s && s.name && s.icon);
  if (pool.length < OPTIONS) return [];
  const rnd = mulberry32(seed);
  const n = Math.min(len, pool.length);
  const answers = shuffle(pool, rnd).slice(0, n);
  const qs = answers.map(ans => {
    const others = pool.filter(s => s.name !== ans.name);
    const distr = shuffle(others, rnd).slice(0, OPTIONS - 1);
    return { ans, opts: shuffle([ans, ...distr], rnd) };
  });
  return shuffle(qs, rnd);
}

/* ---------- 儲存 ---------- */
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!d || !Array.isArray(d.questions) || !d.questions.length) return null;
    return d;
  } catch (e) { return null; }
}

/* ---------- 畫面 ---------- */
function show(n) {
  [...document.querySelectorAll('.screen')].forEach(e => e.classList.remove('on'));
  $('#sc' + n).classList.add('on');
  window.scrollTo(0, 0);
}
function toast(m) {
  const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800);
}

/* ---------- 開始 ---------- */
function newQuiz() {
  const skills = window.NSH_SKILLS || [];
  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  const qs = buildQuiz(skills, QUIZ_LEN, seed);
  if (!qs.length) { toast('題庫資料不足'); return; }
  S = { seed, questions: qs, idx: 0, answers: [] };
  save();
  enterQuiz();
}

function enterQuiz() {
  show('Quiz');
  locked = false;
  paintTrail();
  paintQuestion();
}

function paintTrail() {
  const total = S.questions.length;
  const done = S.answers.length;
  let html = '';
  for (let i = 0; i < total; i++) {
    if (i < done) html += `<i class="${S.answers[i].ok ? 'ok' : 'ng'}"></i>`;
    else if (i === done) html += '<i class="cur"></i>';
    else html += '<i></i>';
  }
  $('#trail').innerHTML = html;
  $('#scNow').textContent = Math.min(done + 1, total);
  $('#scAll').textContent = total;
}

function paintQuestion() {
  const q = S.questions[S.idx];
  const a = q.ans;
  $('#qNo').textContent = S.idx + 1;
  $('#qTags').innerHTML = '';   // 不分類：不顯示職業／體系，全部混合出題
  const img = $('#qIcon');
  img.src = a.icon;
  img.alt = '技能圖示';
  $('#opts').innerHTML = q.opts.map((o, i) =>
    `<button class="opt" data-i="${i}"><span class="lb">${o.name}</span><span class="mark"></span></button>`
  ).join('');
  $('#verdictSlot').innerHTML = '';
  locked = false;
}

/* ---------- 作答 ---------- */
$('#opts').addEventListener('click', e => {
  const btn = e.target.closest('.opt');
  if (!btn || locked) return;
  const q = S.questions[S.idx];
  const picked = q.opts[Number(btn.dataset.i)];
  const ok = picked.name === q.ans.name;
  locked = true;

  [...document.querySelectorAll('.opt')].forEach(b => {
    b.classList.add('locked');
    const o = q.opts[Number(b.dataset.i)];
    if (o.name === q.ans.name) {
      b.classList.add('ok');
      b.querySelector('.mark').textContent = '✓';
    } else if (b === btn) {
      b.classList.add('ng');
      b.querySelector('.mark').textContent = '✕';
    } else {
      b.classList.add('dim');
    }
  });

  S.answers.push({ ok, picked: picked.name, ans: q.ans.name, icon: q.ans.icon, cat: q.ans.cat, job: q.ans.job });
  save();
  paintTrail();

  const last = S.idx >= S.questions.length - 1;
  $('#verdictSlot').innerHTML = `
    <div class="verdict ${ok ? 'good' : 'bad'}">
      <div class="stamp">${ok ? '正解' : '殘念'}</div>
      <div class="txt">
        <span class="k">${ok ? '答對了' : '正確答案是'}</span>
        <span class="v">${q.ans.name}</span>

      </div>
    </div>
    <button class="btn-next" id="btnNext">${last ? '看成績' : '下一題'}<small>${last ? '' : (S.idx + 2) + ' / ' + S.questions.length}</small></button>`;
  $('#btnNext').onclick = () => {
    if (last) enterResult();
    else { S.idx++; save(); enterQuiz(); }
  };
  $('#btnNext').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});

/* ---------- 成績 ---------- */
function rank(pct) {
  if (pct >= 95) return '江湖百曉生';
  if (pct >= 85) return '一代宗師';
  if (pct >= 70) return '名門高手';
  if (pct >= 55) return '行走江湖';
  if (pct >= 35) return '初入師門';
  return '初來乍到';
}

function enterResult() {
  show('Result');
  const total = S.questions.length;
  const right = S.answers.filter(a => a.ok).length;
  const wrong = total - right;
  const pct = Math.round(right / total * 100);
  $('#rankLabel').textContent = rank(pct);
  $('#resRight').textContent = right;
  $('#resTotal').textContent = total;
  $('#resPct').textContent = pct + '%';
  $('#resOk').textContent = right;
  $('#resNg').textContent = wrong;

  const wrongs = S.answers.filter(a => !a.ok);
  const wrap = $('#reviewWrap'), list = $('#reviewList');
  if (wrongs.length) {
    wrap.classList.remove('hide');
    list.innerHTML = wrongs.map(w => `
      <div class="rv">
        <img src="${w.icon}" alt="">
        <div class="t">
          <div class="n">${w.ans}</div>
          <div class="y">你選了：${w.picked}</div>
        </div>
        <div class="x">✕</div>
      </div>`).join('');
  } else {
    wrap.classList.add('hide');
  }
}

/* ---------- 啟動 ---------- */
function boot() {
  $('#verChip').textContent = 'v' + window.APP_VERSION;
  const skills = window.NSH_SKILLS || [];
  const len = Math.min(QUIZ_LEN, skills.length);
  $('#spTotal').innerHTML = `${len}<small>題</small>`;


  $('#btnStart').onclick = newQuiz;
  $('#btnAgain').onclick = newQuiz;
  $('#btnHome').onclick = () => { show('Start'); };

  S = load();
  if (S && S.answers.length < S.questions.length) {
    // 續答上次未完成的測驗
    S.idx = Math.min(S.answers.length, S.questions.length - 1);
    enterQuiz();
  }

  $('#verChip').onclick = async () => {
    if (!confirm('重新載入並清除快取？')) return;
    try {
      const rs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r => r.unregister()));
      if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
    } catch (e) {}
    location.reload();
  };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  window.__quiz = { newQuiz, state: () => S, buildQuiz, show, enterResult, rank, OPTIONS };
}
document.addEventListener('DOMContentLoaded', boot);
</script>
